<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TRON 쇼핑몰</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;min-height:100vh;padding:16px}
.header{text-align:center;padding:20px 0;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:20px}
.header h1{font-size:24px;background:linear-gradient(90deg,#00d4ff,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:rgba(255,255,255,.05);border-radius:16px;padding:20px;border:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.icon{text-align:center;font-size:56px;margin-bottom:12px}
.name{text-align:center;font-size:18px;font-weight:600;margin-bottom:8px}
.desc{text-align:center;font-size:13px;color:#94a3b8;margin-bottom:16px;line-height:1.5}
.price-box{background:rgba(0,212,255,.1);border-radius:12px;padding:16px;text-align:center;margin-bottom:16px}
.price-main{font-size:26px;font-weight:700;color:#00d4ff}
.price-alt{font-size:13px;color:#94a3b8;margin-top:4px}
.pay-title{font-size:15px;margin-bottom:10px;color:#e2e8f0}
.pay-methods{display:flex;gap:10px;margin-bottom:14px}
.pay-btn{flex:1;padding:11px;border-radius:10px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:14px;cursor:pointer;transition:.2s}
.pay-btn.active{border-color:#00d4ff;background:rgba(0,212,255,.18)}
.wallet{background:rgba(0,0,0,.3);border-radius:12px;padding:14px;margin-bottom:14px}
.addr{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);padding:10px;border-radius:8px;margin-bottom:10px}
.addr code{flex:1;font-size:11px;word-break:break-all;color:#00d4ff}
.copy-btn{padding:6px 10px;background:#7c3aed;border:none;border-radius:6px;color:#fff;font-size:12px;cursor:pointer}
.timer{font-size:12px;color:#94a3b8;text-align:center;margin-bottom:12px}
.checkout-btn{width:100%;padding:15px;background:linear-gradient(90deg,#00d4ff,#7c3aed);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.checkout-btn:disabled{opacity:.5;cursor:not-allowed}
.status{background:rgba(0,0,0,.3);border-radius:12px;padding:14px;margin-top:14px;text-align:center;display:none}
.status.ok{background:rgba(34,197,94,.18);border:1px solid #22c55e}
.status.pending{background:rgba(234,179,8,.18);border:1px solid #eab308}
.status.err{background:rgba(239,68,68,.18);border:1px solid #ef4444}
.tx-link{color:#00d4ff;font-size:12px;margin-top:8px;display:block}
</style>
</head>
<body>
<div class="header"><h1>🛒 TRON 쇼핑몰</h1></div>
<div class="card" id="card">
  <div class="icon" id="icon">⏳</div>
  <div class="name" id="name">로딩 중...</div>
  <div class="desc" id="desc"></div>
  <div class="price-box">
    <div class="price-main" id="priceMain">-</div>
    <div class="price-alt" id="priceAlt"></div>
  </div>
  <div class="pay-title">결제 수단 선택</div>
  <div class="pay-methods">
    <button class="pay-btn active" onclick="selPay('trx')">💎 TRX</button>
    <button class="pay-btn" onclick="selPay('usdt')">💵 USDT (TRC20)</button>
  </div>
  <div class="wallet">
    <div class="addr">
      <code id="addr">TWk75rL7Y7yS2eLZhLEpA7UeVVWpTJTih4</code>
      <button class="copy-btn" onclick="copyAddr()">복사</button>
    </div>
    <div class="timer" id="timer">결제 유효시간: 15:00</div>
  </div>
  <button class="checkout-btn" id="payBtn" onclick="doPay()">결제하기</button>
  <div class="status" id="status"><span id="statusText"></span><a class="tx-link" id="txLink" href="#" target="_blank"></a></div>
</div>

<script>
const tg=window.Telegram.WebApp;tg.expand();
let cur=null,method='trx',orderId=null,timer=null;

function getParam(name){const p=new URLSearchParams(location.search);return p.get(name)}

async function loadProducts(){
  try{
    const r=await fetch('/api/products');
    const data=await r.json();
    const pid=getParam('product');
    if(pid){
      cur=data.products.find(p=>p.id==pid);
      if(cur) showProduct();
      else document.getElementById('name').textContent='상품을 찾을 수 없습니다';
    }else{
      document.getElementById('name').textContent='상품 ID를 입력하세요';
    }
  }catch(e){
    document.getElementById('name').textContent='상품 로딩 실패';
  }
}

function showProduct(){
  document.getElementById('icon').textContent=cur.icon||'📦';
  document.getElementById('name').textContent=cur.name;
  document.getElementById('desc').textContent=cur.desc||'';
  updatePrice();
  startTimer();
}

function updatePrice(){
  if(method==='trx'){
    document.getElementById('priceMain').textContent=cur.price_trx+' TRX';
    document.getElementById('priceAlt').textContent='또는 $'+cur.price_usdt+' USDT';
  }else{
    document.getElementById('priceMain').textContent='$'+cur.price_usdt+' USDT';
    document.getElementById('priceAlt').textContent='또는 '+cur.price_trx+' TRX';
  }
}

function selPay(m){
  method=m;
  document.querySelectorAll('.pay-btn').forEach(b=>b.classList.toggle('active',b.textContent.includes(m.toUpperCase())));
  updatePrice();
}

function startTimer(){
  let t=900;
  timer=setInterval(()=>{
    t--;
    const m=Math.floor(t/60),s=t%60;
    document.getElementById('timer').textContent=`결제 유효시간: ${m}:${String(s).padStart(2,'0')}`;
    if(t<=0){clearInterval(timer);document.getElementById('payBtn').disabled=true;document.getElementById('timer').textContent='만료됨';}
  },1000);
}

function copyAddr(){
  navigator.clipboard.writeText('TWk75rL7Y7yS2eLZhLEpA7UeVVWpTJTih4').then(()=>tg.showPopup({title:'복사 완료',buttons:[{type:'ok'}]}));
}

async function doPay(){
  const btn=document.getElementById('payBtn');
  btn.disabled=true;btn.textContent='결제 처리 중...';
  const amount=method==='trx'?cur.price_trx:cur.price_usdt;
  const order=await fetch('/api/payment/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:tg.initDataUnsafe?.user?.id,product_id:cur.id,amount,currency:method.toUpperCase()})}).then(r=>r.json());
  orderId=order.order_id;
  showStatus('pending','결제 대기 중...\n아래 주소로 '+amount+' '+method.toUpperCase()+'을(를) 전송하세요.');
  tg.sendData(JSON.stringify({orderId,amount,currency:method.toUpperCase(),paymentAddress:'TWk75rL7Y7yS2eLZhLEpA7UeVVWpTJTih4'}));
}

function showStatus(type,msg,tx){
  const el=document.getElementById('status'),txt=document.getElementById('statusText'),link=document.getElementById('txLink');
  el.style.display='block';el.className='status '+type;txt.textContent=msg;
  if(tx){link.href='https://tronscan.org/#/transaction/'+tx;link.textContent='트랜잭션 확인';}else link.style.display='none';
}

loadProducts();
</script>
</body>
</html>
